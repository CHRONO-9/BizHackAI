<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Playground</title>
  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1b2735 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 540px;
      width: 90%;
      padding: 2.5rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .container:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 60px -12px rgba(99, 102, 241, 0.25);
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1rem 0.5rem;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 0.25rem;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 0.75rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-primary:hover {
      background: #4f46e5;
      transform: scale(1.03);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <main class="container">
    <span class="badge">Antigravity Demo • Auto-Published</span>
    <h1>Zero Gravity Space</h1>
    <p>マウスを動かすと周囲のパーティクルが反発し、重力の向きや強さをリアルタイムに切り替えられるインタラクティブデモです。<br><small style="color: #a5b4fc;">最終自動更新: 2026-10-13 12:35 JST</small></p>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-value" id="count-val">80</div>
        <div class="stat-label">Particles</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="gravity-val">反重力</div>
        <div class="stat-label">Mode</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="speed-val">1.0x</div>
        <div class="stat-label">Speed</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-primary" id="toggle-gravity">重力モード切替</button>
      <button class="btn-secondary" id="add-particles">＋ パーティクル追加</button>
      <button class="btn-secondary" id="speed-btn">速度変更</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const mouse = { x: -1000, y: -1000 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    // -1: 反重力(上昇), 0: 無重力(浮遊), 1: 通常重力(落下)
    let gravityMode = -1;
    let speedMultiplier = 1;
    const particles = [];

    const colors = ['#6366f1', '#38bdf8', '#a855f7', '#ec4899', '#2dd4bf'];

    function createParticle() {
      return {
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        radius: Math.random() * 3.5 + 1.5,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: Math.random() * 0.6 + 0.3
      };
    }

    for (let i = 0; i < 80; i++) {
      particles.push(createParticle());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        // 重力の影響
        p.vy += gravityMode * 0.015 * speedMultiplier;
        // 最大速度の制限
        p.vy = Math.max(-2.5, Math.min(2.5, p.vy));

        // マウスとの反発
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 120 && dist > 0) {
          const force = (120 - dist) / 120;
          p.x += (dx / dist) * force * 4;
          p.y += (dy / dist) * force * 4;
        }

        p.x += p.vx * speedMultiplier;
        p.y += p.vy * speedMultiplier;

        // 画面端のループ処理
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        // 描画
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();

        // 近くのパーティクル同士を線で結ぶ
        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const d = Math.hypot(p.x - p2.x, p.y - p2.y);
          if (d < 100) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = p.color;
            ctx.globalAlpha = (1 - d / 100) * 0.2;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    animate();

    // UIイベント
    const countVal = document.getElementById('count-val');
    const gravityVal = document.getElementById('gravity-val');
    const speedVal = document.getElementById('speed-val');

    document.getElementById('toggle-gravity').addEventListener('click', () => {
      if (gravityMode === -1) {
        gravityMode = 0;
        gravityVal.textContent = '無重力';
      } else if (gravityMode === 0) {
        gravityMode = 1;
        gravityVal.textContent = '通常重力';
      } else {
        gravityMode = -1;
        gravityVal.textContent = '反重力';
      }
    });

    document.getElementById('add-particles').addEventListener('click', () => {
      for (let i = 0; i < 20; i++) {
        particles.push(createParticle());
      }
      countVal.textContent = particles.length;
    });

    document.getElementById('speed-btn').addEventListener('click', () => {
      speedMultiplier = speedMultiplier === 1 ? 2 : speedMultiplier === 2 ? 0.5 : 1;
      speedVal.textContent = speedMultiplier.toFixed(1) + 'x';
    });
  </script>
</body>
</html>
