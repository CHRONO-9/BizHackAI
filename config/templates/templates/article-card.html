
        <!-- 記事（第{ARTICLE_NUMBER}弾 自動追加） -->
        <article class="article-card" data-category="{CATEGORY_KEY}">
          <div class="card-thumb" style="background: linear-gradient(135deg, {GRADIENT_FROM}, {GRADIENT_TO});">
            <div class="thumb-pattern"></div>
            <div class="thumb-glow"></div>
            <div class="thumb-header">
              <div class="thumb-header-left">
                <span class="series-badge">第{ARTICLE_NUMBER}弾</span>
                <span class="category-tag {CATEGORY_CLASS}">{CATEGORY_LABEL}</span>
              </div>
              <span class="thumb-tag-right">NEW・コピペOK</span>
            </div>
            <div class="thumb-visual">
              <div class="thumb-main-title">{THUMB_TITLE}</div>
            </div>
            <div class="thumb-footer">
              <span class="thumb-date">公開日：{TODAY_DOT}</span>
            </div>
          </div>
          <div class="card-body">
            <h3 class="card-title">
              <a href="article-{ARTICLE_NUMBER}.html">{ARTICLE_TITLE}</a>
            </h3>
            <p class="card-excerpt">
              {ARTICLE_DESC}
            </p>
            <div class="card-meta">
              <div class="author-chip">
                <div class="author-avatar" style="border-color:{AUTHOR_COLOR};"><img src="{AUTHOR_AVATAR}?v=20261016d" alt="{AUTHOR_NAME}" width="26" height="26" loading="lazy"></div>
                <span>{AUTHOR_NAME}</span>
              </div>
              <span>読了目安 6分</span>
            </div>
          </div>
        </article>
